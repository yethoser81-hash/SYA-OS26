<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYA OS — Multi-POS Supermarché & Comptabilité Odoo</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #0f172a; --panel-bg: #1e293b; --card-bg: #334155;
      --accent-green: #10b981; --accent-blue: #3b82f6; --accent-amber: #f59e0b;
      --border-color: #475569; --text-muted: #94a3b8;
    }
    body { background: var(--bg-main); color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; }
    
    header { background: var(--panel-bg); border-bottom: 1px solid var(--border-color); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
    .pos-layout { display: grid; grid-template-columns: 300px 1fr 400px; gap: 15px; padding: 15px; height: calc(100vh - 70px); box-sizing: border-box; }
    
    .panel { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 15px; display: flex; flex-direction: column; }
    .panel-header { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; display: flex; justify-content: space-between; }
    
    .pos-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
    .pos-card.active { border-color: var(--accent-green); background: rgba(16, 185, 129, 0.1); }
    
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; overflow-y: auto; flex: 1; }
    .product-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; text-align: center; cursor: pointer; }
    .product-card:hover { border-color: var(--accent-blue); }
    
    .cart-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 10px; }
    .cart-table th, .cart-table td { padding: 8px; border-bottom: 1px solid var(--border-color); text-align: left; }
    
    .btn { padding: 10px 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; }
    .btn-green { background: var(--accent-green); color: #fff; }
    .btn-blue { background: var(--accent-blue); color: #fff; }
    .btn-amber { background: var(--accent-amber); color: #000; }
  </style>
</head>
<body>

  <header>
    <div style="display:flex; align-items:center; gap:12px;">
      <h2 style="margin:0; font-size:18px;">SYA OS <span style="font-size:12px; color:var(--accent-blue);">| ARCHITECTURE ODOO POS</span></h2>
    </div>
    <div id="sessionStatusBadge" style="background:rgba(16, 185, 129, 0.2); color:var(--accent-green); padding:6px 12px; border-radius:20px; font-size:12px; font-weight:bold;">
      ● Session Active : Caisse 01
    </div>
  </header>

  <div class="pos-layout">
    
    <!-- COLONNE 1 : GESTION MULTI-SESSIONS & POS -->
    <div class="panel">
      <div class="panel-header"><span>🖥️ Points de Vente (POS)</span></div>
      <div id="posList">
        <!-- Rempli dynamiquement -->
      </div>

      <div style="margin-top: auto; border-top: 1px solid var(--border-color); padding-top: 10px;">
        <div class="panel-header"><span>⚙️ Actions Session</span></div>
        <button class="btn btn-blue" onclick="ouvrirSession()">Ouvrir Nouvelle Session</button>
        <button class="btn btn-amber" onclick="cloturerSession()">Fermer Caisse & Bilan</button>
      </div>
    </div>

    <!-- COLONNE 2 : CATALOGUE PRODUITS & SCANNER -->
    <div class="panel">
      <div class="panel-header"><span>📦 Produits & Stock Renseigné</span></div>
      <input type="text" placeholder="🔍 Rechercher un produit ou scanner le code-barres..." style="width:100%; padding:10px; background:var(--card-bg); border:1px solid var(--border-color); color:#fff; border-radius:6px; margin-bottom:12px; box-sizing:border-box;">
      
      <div class="product-grid" id="productGrid">
        <div class="product-card" onclick="ajouterAuPanier('p1', 'Riz Parfumé 50kg', 25000)">
          <strong>Riz Parfumé 50kg</strong><br>
          <small style="color:var(--text-muted);">Stock: 15</small><br>
          <span style="color:var(--accent-green); font-weight:bold;">25 000 F</span>
        </div>
        <div class="product-card" onclick="ajouterAuPanier('p2', 'Huile Raffinée 1L', 1350)">
          <strong>Huile Raffinée 1L</strong><br>
          <small style="color:var(--text-muted);">Stock: 8</small><br>
          <span style="color:var(--accent-green); font-weight:bold;">1 350 F</span>
        </div>
        <div class="product-card" onclick="ajouterAuPanier('p3', 'Lait Concentré 1kg', 800)">
          <strong>Lait Concentré 1kg</strong><br>
          <small style="color:var(--text-muted);">Stock: 45</small><br>
          <span style="color:var(--accent-green); font-weight:bold;">800 F</span>
        </div>
      </div>
    </div>

    <!-- COLONNE 3 : COMMANDE EN COURS & ENCAISSEMENT -->
    <div class="panel">
      <div class="panel-header"><span>🛒 Panier Caisse</span></div>
      <div style="flex:1; overflow-y:auto;">
        <table class="cart-table">
          <thead>
            <tr><th>Article</th><th>Qté</th><th>Total</th></tr>
          </thead>
          <tbody id="cartBody">
            <!-- Rempli à la volée -->
          </tbody>
        </table>
      </div>

      <div style="background:var(--card-bg); padding:12px; border-radius:8px; margin-bottom:10px; text-align:center;">
        <span style="font-size:12px; color:var(--text-muted);">Total À Payer</span><br>
        <strong style="font-size:24px; color:var(--accent-green);" id="cartTotal">0 FCFA</strong>
      </div>

      <label style="font-size:11px; color:var(--text-muted);">Mode de Règlement :</label>
      <select id="paymentMethod" style="width:100%; padding:8px; background:var(--card-bg); color:#fff; border:1px solid var(--border-color); border-radius:6px; margin-bottom:10px;">
        <option value="CASH">Espèces (Compte 571100)</option>
        <option value="MOBILE_MONEY">Mobile Money (Compte 521100)</option>
      </select>

      <button class="btn btn-green" onclick="validerCommande()">✅ Encaisser & Générer Écritures OHADA</button>
    </div>

  </div>

  <script>
    let currentCart = [];
    let activeSessionId = 'sess_101';
    let activePosId = 'pos_caisse_1';

    function ajouterAuPanier(id, name, price) {
      let item = currentCart.find(i => i.id === id);
      if(item) {
        item.qty++;
      } else {
        currentCart.push({ id, name, price, qty: 1 });
      }
      renderCart();
    }

    function renderCart() {
      const tbody = document.getElementById('cartBody');
      tbody.innerHTML = '';
      let total = 0;

      currentCart.forEach(item => {
        let subtotal = item.price * item.qty;
        total += subtotal;
        let tr = document.createElement('tr');
        tr.innerHTML = `<td>${item.name}</td><td>${item.qty}</td><td>${subtotal.toLocaleString()} F</td>`;
        tbody.appendChild(tr);
      });

      document.getElementById('cartTotal').innerText = total.toLocaleString() + ' FCFA';
    }

    async function validerCommande() {
      if(currentCart.length === 0) return alert("Le panier est vide.");

      const payload = {
        pos_id: activePosId,
        session_id: activeSessionId,
        items: currentCart,
        payment_method: document.getElementById('paymentMethod').value,
        cashier_name: 'Paul'
      };

      const res = await fetch('/api/pos/order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if(res.ok) {
        alert("✅ Vente enregistrée avec succès !\nÉcritures comptables OHADA (Ventes + Variation de stock) comptabilisées.");
        currentCart = [];
        renderCart();
      } else {
        const err = await res.json();
        alert("❌ Erreur : " + err.error);
      }
    }

    async function ouvrirSession() {
      const fond = prompt("Entrez le fond de caisse initial (FCFA) :", "50000");
      if(!fond) return;

      await fetch('/api/pos/session/toggle', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pos_id: activePosId, action: 'OPEN', opening_balance: fond })
      });
      alert("Session ouverte avec succès.");
    }

    async function cloturerSession() {
      const reel = prompt("Entrez le montant total présent en caisse (FCFA) :", "150000");
      if(!reel) return;

      await fetch('/api/pos/session/toggle', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pos_id: activePosId, action: 'CLOSE', closing_balance: reel })
      });
      alert("Session clôturée. Le bilan a été calculé et transmis à l'administrateur.");
    }
  </script>
</body>
</html>
